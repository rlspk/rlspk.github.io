<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Railspike slides</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#1b1b1b; --muted:#505050; --rule:#d6d6d6; --link:#0b4f9c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#131313; --fg:#e8e6e1; --muted:#b0aea8; --rule:#3a3a3a; --link:#8ab4f8; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: clamp(1.05rem, 2.6vw, 1.6rem)/1.5 ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif; }
    .slide { position: relative; max-width: 60rem; margin: 0 auto; padding: 4.5rem 1rem 5rem; }
    .slide h1, .slide p { overflow-wrap: anywhere; }
    .slide h1 { margin: 0 0 1rem; font-size: clamp(1.7rem, 6vw, 3rem); line-height: 1.15; }
    .slide p, .slide ul, .slide ol { margin: 0 0 1rem; }
    .slide li { margin: .35rem 0; overflow-wrap: anywhere; }
    .slide a { color: var(--link); }
    .slide pre, .slide code { font: .8em/1.5 ui-monospace, monospace; }
    .slide pre { margin: 0 0 1rem; padding: .8rem; border: 1px solid var(--rule); border-radius: .3rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .logo { position: fixed; top: .75rem; left: 1rem; width: 48px; height: 48px; border-radius: .3rem; background: #fff; }
    .js .slide { display: none; min-height: 100vh; }
    .js .slide.current { display: block; }
    #nav { position: fixed; right: .75rem; bottom: .5rem; display: flex; align-items: center; gap: .5rem; color: var(--muted); font: .9rem ui-monospace, monospace; }
    #nav button { min-width: 44px; min-height: 44px; border: 1px solid var(--link); border-radius: .3rem; background: var(--bg); color: var(--link); font: inherit; cursor: pointer; }
    #nav button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    @media print {
      @page { size: landscape; margin: 1.5cm; }
      :root { --bg:#fff; --fg:#000; --muted:#333; --rule:#999; --link:#000; }
      .logo { position: absolute; }
      .js .slide { display: block; min-height: 0; break-after: page; page-break-after: always; padding: 1rem 0; }
      .slide:last-of-type { break-after: auto; page-break-after: auto; }
      #nav { display: none; }
    }
  </style>
</head>
<body>
<img class="logo" src="../railspike-logo.png" alt="Railspike rail and spike logo" width="48" height="48">
<main id="deck">
  <section class="slide"><h1>Slide 1</h1><p>Placeholder.</p></section>
  <section class="slide"><h1>Slide 2</h1><p>Placeholder.</p></section>
  <section class="slide"><h1>Slide 3: a deliberately long placeholder heading that must wrap cleanly on a phone</h1><p>Placeholder with a long unbroken path docs/plans/railspike_slides/railspike_slides_step3_development_plan.md to test wrapping.</p><pre>Approved Step 1</pre></section>
</main>
<nav id="nav" aria-label="Slides"><button id="prev" type="button" aria-label="Previous slide">&larr;</button><span id="counter" aria-live="polite"></span><button id="next" type="button" aria-label="Next slide">&rarr;</button></nav>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var counter = document.getElementById('counter');
  var i = 0;
  document.documentElement.className += ' js';
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.className = 'slide' + (k === i ? ' current' : ''); });
    counter.textContent = (i + 1) + ' / ' + slides.length;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
  }
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { show(i + 1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { show(i - 1); e.preventDefault(); }
    else if (k === 'Home') { show(0); }
    else if (k === 'End') { show(slides.length - 1); }
  });
  document.getElementById('prev').addEventListener('click', function () { show(i - 1); });
  document.getElementById('next').addEventListener('click', function () { show(i + 1); });
  var x0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.changedTouches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
  }, { passive: true });
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>
